[project]
name = "laya-blackjack"
version = "0.1.0"
description = "A reproducible blackjack laboratory with Laya inference and training"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "numpy>=1.26,<3", "requests>=2.32,<3"]

[project.optional-dependencies]
model = ["laya==0.3.4", "torch==2.8.0", "transformers==4.57.6"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[project.scripts]
blackjack = "blackjack.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blackjack"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
